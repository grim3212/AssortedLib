name: Build

# Manual only for now, until the pipeline has been run by hand a few times. Add back
#   push:
#     branches: [ 26.2 ]
#   pull_request:
#     branches: [ 26.2 ]
# above workflow_dispatch to have it run on its own.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to maven.grimoid.com once every check below passes
        type: boolean
        default: false
      version:
        description: Version to publish (blank uses the one in gradle.properties)
        type: string
        default: ''

# Every job sets Minecraft up from scratch, so a newer run on the same ref makes the running one a
# waste of a runner. Keyed on the event too, so a push never cancels a manual run once triggers
# are back on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build

      - name: Build
        run: ./gradlew build --stacktrace

      # Tests live in their own source set and are never an input to `jar`. A jar that ships them
      # still works, which is why this is checked rather than trusted.
      - name: No test classes ship in the jars
        run: |
          status=0
          for jar in */build/libs/*.jar; do
            hits=$(unzip -l "$jar" | grep -icE 'gametest|test_instance|test_box' || true)
            if [ "$hits" != "0" ]; then
              echo "::error::$jar ships $hits gametest entries"
              status=1
            fi
          done
          exit $status

      - name: Upload the jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            common/build/libs/*.jar
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
            !**/*-sources.jar

  gametest:
    name: Gametests (${{ matrix.loader }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Both loaders always run: which one fails is the useful half of the answer.
      fail-fast: false
      matrix:
        include:
          - loader: neoforge
            task: ':neoforge:runGameTestServer'
            run_dir: neoforge/run
          - loader: fabric
            task: ':fabric:runGameTest'
            run_dir: fabric/build/gametest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build

      # Boots a dedicated server, runs every test_instance, exits non-zero on a failed required
      # test.
      - name: Run the gametests
        run: ./gradlew ${{ matrix.task }} --stacktrace

      - name: Upload the run directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-${{ matrix.loader }}
          if-no-files-found: ignore
          path: |
            ${{ matrix.run_dir }}/logs/
            ${{ matrix.run_dir }}/crash-reports/
            ${{ matrix.run_dir }}/report.xml

  datagen:
    name: Datagen
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build

      # Catches generated output that was never regenerated and committed.
      - name: Datagen is committed
        run: |
          ./gradlew :neoforge:runClientData :fabric:runDatagenClient --stacktrace
          changed="$(git status --porcelain -- common/src/generated fabric/src/generated)"
          if [ -n "$changed" ]; then
            echo "::error::Datagen does not match what is committed"
            echo "$changed"
            git diff --stat -- common/src/generated fabric/src/generated
            exit 1
          fi

  # Manual only, and only when the box is ticked - a push to 26.2 must never publish. `needs` covers
  # every other job, and a matrix `needs` waits for all of its legs, so a single failed gametest on
  # either loader skips this. Nothing here rebuilds what was already checked; it republishes from
  # the same sources, which is why it re-runs the build rather than downloading the jars artifact:
  # the POMs and sources jars are not in it.
  publish:
    name: Publish to Maven
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [ build, gametest, datagen ]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Add required reviewers to this environment in the repository settings to gate a publish
    # behind an approval. With no protection rules it is a no-op.
    environment: maven
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build

      # `version` reaches gradle through the environment rather than through `${{ }}` inside the
      # script, so a crafted input cannot run as shell.
      - name: Publish
        env:
          MAVEN_DEPLOY_USER: ${{ secrets.MAVEN_DEPLOY_USER }}
          MAVEN_DEPLOY_TOKEN: ${{ secrets.MAVEN_DEPLOY_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$MAVEN_DEPLOY_TOKEN" ]; then
            echo "::error::MAVEN_DEPLOY_TOKEN is not set - the publish would silently do nothing"
            exit 1
          fi
          if [ -n "$VERSION" ]; then
            ./gradlew publishAllPublicationsToAssortedModsRepository "-Pversion=$VERSION" --stacktrace
          else
            ./gradlew publishAllPublicationsToAssortedModsRepository --stacktrace
          fi

      - name: Summary
        env:
          VERSION: ${{ inputs.version }}
        run: |
          published="${VERSION:-$(sed -n 's/^version=//p' gradle.properties)}"
          mc="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          {
            echo "Published \`$published\` to <https://maven.grimoid.com/#/mods/com/grim3212/assorted/lib>"
            echo
            for loader in common fabric neoforge; do
              echo "- \`com.grim3212.assorted.lib:assortedlib-$loader-$mc:$published\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
